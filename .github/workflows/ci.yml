# ============================================================================
#  Intégration continue — guardian (nom de travail)
# ----------------------------------------------------------------------------
#  Le développement a lieu sous Windows 11 ; la CIBLE d'exécution est Linux
#  (Budgie/Ubuntu). Cette CI verrouille donc la cible Linux réelle et les fins
#  de ligne LF, et rejoue la chaîne qualité (ruff + mypy --strict + pytest) que
#  l'on exige localement avant chaque commit (CARNET_DE_BORD.md §2).
#
#  Trois jobs :
#    - lint    : ruff (lint + format), mypy --strict, contrôle LF (une version).
#    - tests   : pytest sur la matrice des versions Python supportées (>= 3.11).
#    - gui     : tests PyQt6 (extra optionnel [gui]) en mode offscreen sous xvfb.
#
#  100 % hors-ligne côté produit : la CI n'installe que l'outillage de dev et,
#  pour le job gui, les bibliothèques système Qt. Aucun outil forensic réel
#  (adb, mvt, idevicebackup2) n'est requis : les tests emploient des simulacres.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lecture seule : la CI ne pousse rien, ne publie rien.
permissions:
  contents: read

# Annule les exécutions obsolètes d'une même référence (économie de runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typage (ruff, mypy --strict, LF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer l'outillage de dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff — lint
        run: ruff check .
      - name: Ruff — format (vérification, fins de ligne LF)
        run: ruff format --check .
      - name: mypy --strict
        run: mypy guardian
      - name: Contrôle des fins de ligne (aucun CRLF committé)
        run: |
          if git grep -lIP '\r$' -- .; then
            echo "::error::Des fichiers suivis contiennent des fins de ligne CRLF (cible Linux : LF requis)."
            exit 1
          fi

  tests:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer le projet (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest

  gui:
    name: Tests GUI (PyQt6, offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # PyQt6 exige quelques bibliothèques système, même en mode « offscreen ».
      - name: Bibliothèques système Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Installer le projet (dev + gui)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: pytest (GUI) — offscreen sous xvfb
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a pytest tests/test_gui_app.py
